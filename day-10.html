<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }
        .container{
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
        }
        h1{
            font-size: 5vw;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            
        }
        p{
            font-size: 1.2rem;
            line-height: 1.6;
            color: #555;
        }
        button{
            font-size: 1rem;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>hello CSS! </h1>
        <p>
            This is a simple example of CSS unit and typography. It uses px, %, rem, and vw units along with different typography properties.
        </p>
        <button> Learn More </button>
    </div>
</body>
</html>
