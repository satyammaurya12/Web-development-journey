<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attractive website</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2ff;
        }
        .card{
            width: 320px;
            margin: 100px auto;
            padding: 25px;
            border: 3px solid #6366f1;
            border-radius: 20px;
            background-color: white;
            text-align: center;
            box-shadow: 0 10px 25px #999;
        }
        h1{
            color: #4f46e5;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p{
            color: #555;
            font-size: 17px;
            line-height: 1.6;
        }
        button{
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover{
            background-color: #3730a3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>hello</h1>
        <p>Welcome to the website. 
            This page demonstrates CSS Text Style and Box model
        </p>
        <button>Explore</button>
    </div>
</body>
</html>
