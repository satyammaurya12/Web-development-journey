<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>
    <style>
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2ff;
            font-family: Arial, Helvetica, sans-serif;
        }
        .card{
            width: 300px;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 5px 20px #bbb;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .icon{
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #6366f1;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;

        }
        button{
            padding: 10px 25px;
            border: 0;
            border-radius: 20px;
            background: #6366f1;
            color: white;

        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">💻</div>
        <h2>Code Master</h2>
        <p>Learning HTML &CSS </p>
        <button>Follow</button>
    </div>
</body>
</html>
