<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css grid basics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            height: 100px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #6a5af9, #8f7cff);
            color: white;
        }

        header h1 {
            font-size: 32px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 180px);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            display: grid;
            place-items: center;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .card p {
            color: #666;
            line-height: 1.5;
        }

        .big-card {
            grid-column: span 2;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
            margin-top: 30px;
        }

        @media(max-width:700px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            .big-card {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>✨CSS Grid Basics</h1>
    </header>
    <main class="container">
        <div class="card big-card">
            <div>
                <h2>display:grid </h2>
                <p><b>display:grid </b>is used to activate the grid layout </p>
            </div>
        </div>
        <div class="card">
            <div>
                <h2>columns </h2>
                <p>
                    You can define columns from Grid-Template-Column.
                </p>
            </div>
        </div>
        <div class="card">
            <div>
                <h2>1fr </h2>
                <p>
                fr represents a fraction of available space.
                </p>
            </div>
        </div>
         <div class="card">
            <div>
                <h2>repeat()</h2>
                <p>
               
               It is used to repeat the same Columns or Rows
                </p>
            </div>
        </div>
        
    </main>
    <footer>
        Made with💖using CSS Grid
    </footer>
</body>

</html>
