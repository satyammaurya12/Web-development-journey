<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(148, 236, 236);

        }

        h1 {
            color: blue;
        }

        h2 ,p {
            color: green;
        }

        .box {
            background-color: rgb(125, 179, 225);
        }
        #special{
            color: red;
        }
    </style>
</head>

<body>
    <h1>CSS Selectors</h1>
    <h2>Introduction </h2>
    <p>This is the paragraph</p>
    <p class="box"> This paragraph uses a class selectors.</p>
    <p id="special"> This paragraph uses an Id selectors </p>
</body>

</html>
